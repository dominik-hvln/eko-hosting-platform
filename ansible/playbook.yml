---
- name: Configure and Provision New Hosting Server
  hosts: all
  become: yes
  vars:
    mysql_root_password: "CHANGEME"
    php_versions:
      - '8.2'
      - '8.1'
      - '7.4'

  tasks:
    - name: 1. System Update and Prerequisities
      apt:
        name:
          - software-properties-common
          - apt-transport-https
        state: present
        update_cache: yes

    - name: 2. Add Ondřej Surý PPA for PHP
      apt_repository:
        repo: 'ppa:ondrej/php'
        state: present
        update_cache: yes

    - name: 3. Install Core Software Stack (Nginx, MariaDB, PHP, etc.)
      apt:
        name:
          - nginx
          - mariadb-server
          - vsftpd
          - postfix
          - dovecot-core
          - dovecot-imapd
          - dovecot-pop3d
          - ufw
          - "php{{ item }}-fpm"
          - "php{{ item }}-mysql"
          - "php{{ item }}-curl"
          - "php{{ item }}-gd"
          - "php{{ item }}-zip"
          - "php{{ item }}-mbstring"
          - "php{{ item }}-xml"
        state: present
      loop: "{{ php_versions }}"

    # --- POCZĄTEK OSTATECZNEJ POPRAWKI DLA MARIADB ---
    - name: 4. Secure MariaDB Installation (Foolproof Method)
      block:
        - name: Stop MariaDB to change settings
          ansible.builtin.systemd:
            name: mariadb
            state: stopped

        - name: Start MariaDB in safe mode (skip grant tables)
          ansible.builtin.shell: "nohup /usr/sbin/mysqld_safe --skip-grant-tables --skip-networking &"
          async: 10
          poll: 0

        - name: Wait for the safe mode server to be available
          ansible.builtin.wait_for:
            path: /var/run/mysqld/mysqld.sock
            state: present
            timeout: 30

        - name: Set root password and change auth plugin
          ansible.builtin.shell: |
            mysql -u root -e "FLUSH PRIVILEGES;"
            mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}';"
            mysql -u root -e "UPDATE mysql.user SET plugin = 'mysql_native_password' WHERE User = 'root';"
            mysql -u root -e "FLUSH PRIVILEGES;"
          args:
            executable: /bin/bash

        - name: Stop the safe mode MariaDB process
          ansible.builtin.shell: "kill `cat /var/run/mysqld/mysqld.pid`"

        - name: Ensure the safe mode process is gone
          ansible.builtin.wait_for:
            path: /var/run/mysqld/mysqld.sock
            state: absent

        - name: Start MariaDB service normally
          ansible.builtin.systemd:
            name: mariadb
            state: started
            enabled: yes

        - name: Remove anonymous MariaDB users
          ansible.builtin.shell: "mysql -u root -p'{{ mysql_root_password }}' -e \"DELETE FROM mysql.user WHERE User='';\""

        - name: Remove MariaDB test database
          ansible.builtin.shell: "mysql -u root -p'{{ mysql_root_password }}' -e \"DROP DATABASE IF EXISTS test;\""
    # --- KONIEC OSTATECZNEJ POPRAWKI DLA MARIADB ---

    - name: 5. Copy Provisioning Scripts
      copy:
        src: "scripts/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
      loop:
        - create_account.sh
        - manage_domain.sh
        - manage_database.sh

    - name: 6. Configure and Enable Firewall (UFW)
      ansible.builtin.ufw: # Zmiana na FQCN dla spójności
        rule: allow
        port: "{{ item }}"
      loop:
        - '20'
        - '21'
        - '22'
        - '80'
        - '443'
        - '25'
        - '110'
        - '143'
        - '465'
        - '993'
        - '995'

    - name: 7. Enable UFW
      ansible.builtin.ufw:
        state: enabled

    - name: 8. Ensure all services are started and enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - mariadb
        - vsftpd
        - postfix
        - dovecot
        - "php8.2-fpm"
        - "php8.1-fpm"
        - "php7.4-fpm"